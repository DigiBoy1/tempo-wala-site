<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MOOD वाला — Nitinsinghverse</title>
<link rel="stylesheet" href="style.css" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@700&family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="stage">

    <!-- BACKGROUND VIDEO — put your file at frontend/background.mp4 -->
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="background.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <header class="topbar">
      <div class="pill clock-pill">
        <span class="pill-icon">🕐</span>
        <div>
          <div class="pill-main" id="clock">--:--</div>
          <div class="pill-sub" id="dateLine">--</div>
        </div>
      </div>

      <div class="pill status-pill">
        <span class="status-dot"></span>
        <div>
          <div class="pill-main online-text">ONLINE</div>
          <div class="pill-sub"><span id="userCount">–</span> listening now</div>
          <div class="pill-sub admin-live-badge" id="adminLiveBadge" hidden>🎧 Admin is Live</div>
        </div>
      </div>
    </header>

    <div class="brandmark" id="brandLogo">
      <svg class="brand-orbit" viewBox="0 0 100 40" width="120">
        <path d="M20 30 A20 20 0 1 1 80 30" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="20" cy="30" r="1.5" fill="currentColor"/>
        <circle cx="80" cy="30" r="1.5" fill="currentColor"/>
      </svg>
      <div class="brand-name">Nitinsinghverse</div>
    </div>

    <main class="hero">
      <h1 class="title">
        <span class="title-mood">MOOD</span>
        <span class="title-wala">वाला</span>
      </h1>
      <div class="live-badge">📻 LIVE RADIO</div>
      <p class="tagline">Feel the vibes. Live the mood.</p>
    </main>

    <button id="joinBtn" class="join-btn">🎵 Tap to join the radio</button>

    <div id="player" class="hidden-player"></div>

    <!-- Admin login popup -->
    <div id="adminModal" class="modal-overlay" hidden>
      <div class="modal-box">
        <div class="modal-title">Welcome Admin</div>
        <input type="password" id="adminPasswordInput" placeholder="Enter password" />
        <div class="modal-buttons">
          <button id="adminSubmitBtn">Enter</button>
          <button id="adminCancelBtn" class="modal-cancel">Cancel</button>
        </div>
        <div id="adminError" class="modal-error" hidden>Wrong password</div>
      </div>
    </div>

    <!-- Admin control panel (only visible after login) -->
    <div id="adminPanel" class="admin-panel" hidden>
      <div class="admin-header">🎛 Admin Controls</div>

      <div class="admin-section">
        <div class="admin-label">Playlists</div>
        <div id="playlistButtons" class="playlist-buttons"></div>
      </div>

      <div class="admin-section">
        <div class="admin-label">Play a link (then auto-returns to playlist)</div>
        <div class="link-row">
          <input type="text" id="linkInput" placeholder="Paste YouTube / YT Music link" />
          <button id="linkPlayBtn">Play</button>
        </div>
      </div>

      <div class="admin-section">
        <div class="admin-label">Requests <span id="requestCount"></span></div>
        <div id="requestList" class="request-list"></div>
      </div>
    </div>

    <!-- Song request box (visible to everyone, only usable while admin is online) -->
    <div id="requestBox" class="request-box" hidden>
      <input type="text" id="requestInput" placeholder="Request a song…" maxlength="200" />
      <button id="requestSendBtn">Send</button>
    </div>

    <footer class="dock" id="dock" hidden>
      <div class="dock-left">
        <img id="albumArt" class="album-art" src="" alt="">
        <div class="dock-info">
          <div class="dock-label">NOW PLAYING</div>
          <div class="dock-title" id="songTitle">—</div>
          <div class="dock-artist" id="songArtist">—</div>
        </div>
      </div>

      <div class="dock-right">
        <div class="volume-control">
          <span class="vol-icon">🔊</span>
          <input type="range" id="volumeSlider" min="0" max="100" value="80" />
        </div>
        <div class="live-tag"><span class="pulse"></span> LIVE</div>
      </div>
    </footer>
  </div>

  <script src="https://tempo-wala.onrender.com/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
